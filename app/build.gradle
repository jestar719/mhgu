apply plugin: 'com.android.application'

def properties = new Properties()
properties.load(new FileInputStream(rootProject.file('keystone.properties')))
def path = properties['KEY_PATH']


android {
    namespace "cn.jestar.mhgu"
    compileSdkVersion rootProject.ext.compileSdk
    applicationVariants.all { variant ->
        if (variant.buildType.name.contentEquals('release')) {
            variant.outputs.all { output ->
                outputFileName = "mhgu_${vCode}.apk"
            }
        }
    }


    defaultConfig {
        applicationId "cn.jestar.mhgu"
        minSdkVersion rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdk
        versionCode vCode
        versionName vName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            keyAlias properties['KEY_ALIAS']
            keyPassword properties['KEY_PASSWORD']
            storeFile file(path)
            storePassword properties['KEY_PASSWORD']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':db')
    implementation files('libs/crasheye-2.2.5.jar')
    implementation design
    implementation cardview
    implementation constraint
    implementation annotation
    testImplementation junit
    androidTestImplementation testRunner
    androidTestImplementation espresso
}
